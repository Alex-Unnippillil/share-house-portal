name: supabase-migrations

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint-and-apply:
    name: Lint and apply Supabase migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: supabase/postgres:15.1.0.81
        ports:
          - 54322:5432
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint migrations
        run: npm run lint:migrations

      - name: Apply migrations to ephemeral database
        run: npx --yes supabase@latest db push --db-url postgresql://postgres:postgres@localhost:54322/postgres
