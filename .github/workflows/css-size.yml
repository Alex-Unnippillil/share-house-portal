name: css-size

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  purge:
    name: Purge & audit CSS bundle
    runs-on: ubuntu-latest
    env:
      CSS_BUNDLE_MAX_KB: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify purged CSS size
        run: npm run css:purge

  bundle:
    name: Analyze JavaScript bundle
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
      MAIN_BUNDLE_ENTRYPOINT: app/page
      MAIN_BUNDLE_MAX_KB: 480
      MAIN_BUNDLE_METRIC: gzip
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build bundle stats report
        run: npm run analyze

      - name: Enforce main bundle budget
        run: npm run bundle:budget

      - name: Upload bundle analyzer artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: bundle-analyzer
          path: .next/analyze
