name: css-size

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  purge:
    name: Purge & audit CSS bundle
    runs-on: ubuntu-latest
    env:
      CSS_BUNDLE_MAX_KB: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Read pnpm version
        id: pnpm-version
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('fs');
          const line = fs
            .readFileSync('.npmrc', 'utf8')
            .split(/\r?\n/)
            .find((entry) => entry.startsWith('packageManager='));
          if (!line) {
            throw new Error('packageManager entry is missing from .npmrc');
          }
          const version = line.split('=')[1];
          process.stdout.write(`version=${version}`);
          NODE

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.pnpm-version.outputs.version }}
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify purged CSS size
        run: pnpm run css:purge
