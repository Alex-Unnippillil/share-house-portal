name: Commitlint

on:
  pull_request:
  push:
    branches:
      - '**'

jobs:
  lint:
    name: Lint commits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.5.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run commitlint
        run: pnpm exec commitlint --from HEAD~1
