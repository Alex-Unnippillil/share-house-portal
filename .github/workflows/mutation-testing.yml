name: mutation-testing

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  mutation:
    name: Mutation testing
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run mutation tests
        env:
          CI: true
        run: npm run test:mutation
